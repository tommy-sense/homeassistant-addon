name: TOMMY Zero (beta)
version: "7.0.1"
slug: tommysense-homeassistant-addon-beta
description: TOMMY Zero is a Wi-Fi sensing system that uses Channel State Information (CSI) from Wi-Fi packets to turn existing devices into presence sensors. It runs on your own hardware and all sensing data stays on your local network
url: "https://github.com/tommy-sense/homeassistant-addon"
arch:
  - aarch64
  - amd64
image: tommysense/virtual-bridge
startup: application
boot: auto
stage: experimental
host_network: true
apparmor: true
ingress: true
ingress_port: 0
panel_icon: mdi:wifi-arrow-left-right
init: false
map:
  - type: data
    read_only: False
options:
  ports:
    dashboard: 8089
    file_server_http: 8090
    file_server_https: 8091
    mqtt: 1886
    udp_relay: 8547
  allowed_origins: []
schema:
  ports:
    dashboard: port
    file_server_http: port
    file_server_https: port
    mqtt: port
    udp_relay: port
  allowed_origins:
    - url